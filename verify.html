<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>CLEAR CODE CHECK</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0b0710;color:#eee;font:16px/1.6 system-ui,'Hiragino Sans',sans-serif;padding:16px}
main{max-width:560px;margin:0 auto}
h1{font:800 22px 'Chakra Petch',system-ui,sans-serif;letter-spacing:.12em;color:#ffc96a;margin:8px 0 14px}
input{width:100%;box-sizing:border-box;padding:12px;font:700 20px monospace;letter-spacing:.1em;background:#170f20;color:#fff;border:1px solid #6b4a8a;border-radius:8px}
button{margin-top:10px;padding:10px 16px;font:700 15px system-ui;border-radius:8px;border:0;background:#ffc96a;color:#1a1020}
button.alt{background:#2a1d38;color:#eee}
#res{margin-top:14px;padding:14px;border-radius:10px;background:#170f20;min-height:3em}
.ok{color:#7dffb0}.ng{color:#ff6a7a}.warn{color:#ffd166}
.amt{font:800 34px 'Chakra Petch',system-ui;color:#ffc96a}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}td{padding:6px 4px;border-bottom:1px solid #2a1d38}
small{color:#aaa}
</style></head><body><main>
<h1>CLEAR CODE CHECK</h1>
<input id="code" placeholder="CF-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters">
<button id="chk">確認</button>
<div id="res"><small>参加者のクリアコードを入れて確認</small></div>
<h1 style="margin-top:26px">支払い済み <span id="sum"></span></h1>
<table id="list"></table>
<p><small>支払い記録はこの端末のブラウザにだけ保存されます。同じ端末で確認してください。</small></p>
<button class="alt" id="exp">記録をコピー</button>
</main>
<script>
const RW_B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ', RW_EPOCH = Date.UTC(2026, 0, 1);
const RW_K = ['c', 'h', 'r', 'o', 'n', 'o', '-', 's', 'z', 'o', 'u', '-', '2', '0', '2', '9'].join('');
function rwCheck(p) {   // p: BigInt payload -> 24-bit check
  let h = 0x811c9dc5; const s = RW_K + ':' + p.toString(16) + ':' + RW_K.length;
  for (let r = 0; r < 3; r++) for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i) + r * 31; h = Math.imul(h, 0x01000193) >>> 0; h ^= h >>> 13; }
  return h & 0xffffff;
}
function rwEncode(amount, day, rnd) {
  const p = (BigInt(amount / 1000 | 0) << 32n) | (BigInt(day & 0xfff) << 20n) | BigInt(rnd & 0xfffff), v = (p << 24n) | BigInt(rwCheck(p));
  let s = ''; for (let i = 0; i < 12; i++) s = RW_B32[Number((v >> BigInt(5 * i)) & 31n)] + s;
  return 'CF-' + s.slice(0, 4) + '-' + s.slice(4, 8) + '-' + s.slice(8);
}
function rwDecode(code) {
  let c = String(code || '').toUpperCase().replace(/[^0-9A-Z]/g, ''); if (c.length === 14 && c.startsWith('CF')) c = c.slice(2);
  c = c.replace(/[OIL]/g, m => m === 'O' ? '0' : '1');
  if (c.length !== 12) return { ok: false };
  let v = 0n; for (const ch of c) { const k = RW_B32.indexOf(ch); if (k < 0) return { ok: false }; v = (v << 5n) | BigInt(k); }
  const p = v >> 24n, ok = Number(v & 0xffffffn) === rwCheck(p), amount = Number(p >> 32n) * 1000, day = Number((p >> 20n) & 0xfffn);
  return { ok: ok && amount >= 1000 && amount <= 10000, amount, date: new Date(RW_EPOCH + day * 864e5), id: Number(p & 0xfffffn) };
}

const $ = s => document.querySelector(s), fmt = n => '¥' + n.toLocaleString('ja-JP');
const load = () => { try { return JSON.parse(localStorage.getItem('cf_paid') || '[]'); } catch (e) { return []; } };
const save = l => { try { localStorage.setItem('cf_paid', JSON.stringify(l)); } catch (e) { } };
const norm = c => { const d = rwDecode(c); if (!d.ok) return null; return rwEncode(d.amount, Math.round((d.date - RW_EPOCH) / 864e5), d.id); };
function render() {
  const l = load(); let t = 0; $('#list').innerHTML = l.map(p => { t += p.amount; return `<tr><td>${p.code}</td><td>${fmt(p.amount)}</td><td>${p.who || ''}</td><td><small>${new Date(p.at).toLocaleString('ja-JP')}</small></td></tr>`; }).join('');
  $('#sum').textContent = `${fmt(t)} / ¥20,000`;
}
$('#chk').onclick = () => {
  const raw = $('#code').value, d = rwDecode(raw), r = $('#res');
  if (!d.ok) { r.innerHTML = '<b class="ng">✕ 無効なコード</b><br><small>入力ミスか、偽造の可能性があります</small>'; return; }
  const code = norm(raw), paid = load().find(p => p.code === code);
  r.innerHTML = `<b class="ok">✓ 正しいコード</b><div class="amt">${fmt(d.amount)}</div><small>発行日 ${d.date.toLocaleDateString('ja-JP')}　コード ${code}</small>` +
    (paid ? `<p class="warn">⚠ このコードは支払い済みです（${paid.who || ''} ${new Date(paid.at).toLocaleString('ja-JP')}）</p>`
          : `<p><input id="who" placeholder="Xのアカウント名（メモ）" style="font-size:16px;letter-spacing:0"><button id="pay">支払い済みにする</button></p>`);
  const pb = $('#pay'); if (pb) pb.onclick = () => { const l = load(); l.push({ code, amount: d.amount, who: $('#who').value.trim(), at: Date.now() }); save(l); render(); $('#chk').onclick(); };
};
$('#exp').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(load().map(p => [p.code, p.amount, p.who, new Date(p.at).toLocaleString('ja-JP')].join('\t')).join('\n')); $('#exp').textContent = 'コピーしました'; };
render();
</script></body></html>
